name: Draft Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, without leading v. Example: 1.3.0"
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare-release:
    name: Prepare version commit
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          token: ""

      - name: Validate version input
        id: version
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          TAG="$(node ReMakeplaceUpdater/scripts/release-version.mjs "$VERSION")"

          if RELEASE_DRAFT="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$RELEASE_DRAFT" == "true" ]]; then
              echo "Removing existing draft release $TAG so this run can rebuild it cleanly."
              gh release delete "$TAG" --yes --cleanup-tag
            else
              echo "Release $TAG already exists and is not a draft. Choose a new version." >&2
              exit 1
            fi
          fi
          if git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Delete the stale tag or choose a new version." >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version files
        working-directory: ./ReMakeplaceUpdater
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

          node <<'NODE'
          const fs = require("fs");
          const version = process.env.VERSION;

          const tauriPath = "src-tauri/tauri.conf.json";
          const tauri = JSON.parse(fs.readFileSync(tauriPath, "utf8"));
          tauri.version = version;
          fs.writeFileSync(tauriPath, JSON.stringify(tauri, null, 2) + "\n");

          const cargoPath = "src-tauri/Cargo.toml";
          let cargo = fs.readFileSync(cargoPath, "utf8");
          cargo = cargo.replace(/^version = ".*"$/m, `version = "${version}"`);
          fs.writeFileSync(cargoPath, cargo);

          const lockPath = "src-tauri/Cargo.lock";
          let lock = fs.readFileSync(lockPath, "utf8");
          lock = lock.replace(
            /(\[\[package\]\]\nname = "remakeplaceupdater"\nversion = ")[^"]+(")/,
            `$1${version}$2`,
          );
          fs.writeFileSync(lockPath, lock);
          NODE
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Commit version bump
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No version files changed; using current HEAD."
          else
            git add ReMakeplaceUpdater/package.json ReMakeplaceUpdater/package-lock.json ReMakeplaceUpdater/src-tauri/tauri.conf.json ReMakeplaceUpdater/src-tauri/Cargo.toml ReMakeplaceUpdater/src-tauri/Cargo.lock
            git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
            git push
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish-tauri:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    needs: prepare-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            arch: aarch64
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            arch: x64
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            arch: x64
            args: ""
          - platform: windows-latest
            arch: x64
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.sha }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          token: ""
          cache: npm
          cache-dependency-path: ./ReMakeplaceUpdater/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./ReMakeplaceUpdater/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: ./ReMakeplaceUpdater
        run: npm ci

      - name: Build app and upload installer assets
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./ReMakeplaceUpdater
          tagName: ${{ needs.prepare-release.outputs.tag }}
          releaseName: ReMakeplace Autoupdater v${{ needs.prepare-release.outputs.version }}
          releaseBody: |
            Installers and portable builds for ReMakeplace Autoupdater v${{ needs.prepare-release.outputs.version }}.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      - name: Create portable asset
        id: portable
        shell: bash
        working-directory: ./ReMakeplaceUpdater
        run: |
          VERSION="${{ needs.prepare-release.outputs.version }}"
          PLATFORM="${{ matrix.platform }}"
          ARCH="${{ matrix.arch }}"

          if [[ "$PLATFORM" == "windows-latest" ]]; then
            PORTABLE_NAME="ReMakeplace.Autoupdater_${VERSION}_portable_windows_${ARCH}.exe"
            cp "src-tauri/target/release/remakeplaceupdater.exe" "$PORTABLE_NAME"
          elif [[ "$PLATFORM" == "ubuntu-22.04" ]]; then
            PORTABLE_NAME="ReMakeplace.Autoupdater_${VERSION}_portable_linux_${ARCH}.tar.gz"
            mkdir -p portable
            cp "src-tauri/target/release/remakeplaceupdater" portable/remakeplaceupdater
            chmod +x portable/remakeplaceupdater
            tar -C portable -czf "$PORTABLE_NAME" remakeplaceupdater
          elif [[ "$PLATFORM" == "macos-latest" ]]; then
            PORTABLE_NAME="ReMakeplace.Autoupdater_${VERSION}_portable_macos_${ARCH}.app.tar.gz"
            if [[ "$ARCH" == "aarch64" ]]; then
              APP_PATH="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/ReMakeplace Autoupdater.app"
            else
              APP_PATH="src-tauri/target/x86_64-apple-darwin/release/bundle/macos/ReMakeplace Autoupdater.app"
            fi
            tar -czf "$PORTABLE_NAME" -C "$(dirname "$APP_PATH")" "$(basename "$APP_PATH")"
          fi

          test -f "$PORTABLE_NAME"
          echo "path=ReMakeplaceUpdater/$PORTABLE_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload portable asset to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          PORTABLE_PATH: ${{ steps.portable.outputs.path }}
        run: |
          for attempt in {1..24}; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done

          gh release upload "$TAG" "$PORTABLE_PATH" --clobber
